name: Validate and publish gallery editor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shared format and actual C viewer
        run: |
          mkdir -p tests/output
          node --check docs/app.js
          node --check docs/gallery-storage.js
          node tests/format-test.cjs
          gcc -std=c99 -Wall -Wextra -Werror tests/gallery-test.c src/gallery.c -o tests/output/gallery-test
          tests/output/gallery-test
          gcc -std=c99 -DSIMULATOR=1 -Dmain=app_main -c src/main.c -o tests/output/main-test.o
          gcc tests/runtime-test.c tests/output/main-test.o src/gallery.c -lm -o tests/output/runtime-test
          tests/output/runtime-test
  deploy:
    if: github.repository == 'xyrpxx/Multi-Cheatsheet-Numworks' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
